<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; overflow: hidden; width: 1920px; height: 1080px; }

#alerta-wrap {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  font-family: 'Rajdhani', sans-serif;
}

.alerta-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  background: rgba(10, 5, 20, 0.92);
  border: 2px solid rgba(244, 114, 182, 0.8);
  clip-path: polygon(24px 0%, calc(100% - 24px) 0%, 100% 24px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 24px 100%, 0% calc(100% - 24px), 0% 12px);
  padding: 24px 48px; text-align: center;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 30px rgba(244,114,182,0.5), 0 0 60px rgba(244,114,182,0.2);
  opacity: 0; transform: scale(0.7);
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  min-width: 420px;
}
.alerta-card.visible { opacity: 1; transform: scale(1); }
.alerta-card.hiding  { opacity: 0; transform: scale(0.8); transition: opacity 0.4s ease, transform 0.4s ease; }
.alerta-icon  { font-size: 40px; line-height: 1; }
.alerta-event { font-size: 14px; color: rgba(244,114,182,0.7); letter-spacing: 0.15em; text-transform: uppercase; }
.alerta-user  { font-size: 42px; font-weight: 700; color: #fff; letter-spacing: -1px; line-height: 1; text-shadow: 0 0 20px rgba(244,114,182,0.6); }
.alerta-extra { font-size: 18px; color: rgba(255,255,255,0.5); }
.alerta-time  { font-size: 22px; font-weight: 700; color: #4adeaa; text-shadow: 0 0 12px rgba(74,222,170,0.6); }
.alerta-bar   { width: 100%; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.alerta-bar-fill { height: 100%; background: linear-gradient(90deg, #be185d, #f472b6); border-radius: 2px; width: 100%; transform-origin: left; animation: barShrink linear forwards; }
@keyframes barShrink { 0% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
</style>
</head>
<body>
<div id="alerta-wrap"></div>
<script>
const WS_URL = 'wss://stream-counter-server-production.up.railway.app';
const DURATION = 6000;
let socket = null;
let alertaTimeout = null;

function showAlerta(username, amount, mins) {
  const wrap = document.getElementById('alerta-wrap');
  wrap.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'alerta-card';
  card.innerHTML = `
    <div class="alerta-icon">💜</div>
    <div class="alerta-event">¡Donación externa!</div>
    <div class="alerta-user">${username || 'Anónimo'}</div>
    <div class="alerta-extra">${amount}€</div>
    <div class="alerta-time">+${mins} min</div>
    <div class="alerta-bar"><div class="alerta-bar-fill" style="animation-duration:${DURATION}ms"></div></div>
  `;
  wrap.appendChild(card);
  setTimeout(() => card.classList.add('visible'), 50);
  if (alertaTimeout) clearTimeout(alertaTimeout);
  alertaTimeout = setTimeout(() => {
    card.classList.add('hiding');
    setTimeout(() => { wrap.innerHTML = ''; }, 450);
  }, DURATION);
}

function connect() {
  try { socket = new WebSocket(WS_URL); } catch(e) { setTimeout(connect, 5000); return; }
  socket.addEventListener('open', () => {
    socket.send(JSON.stringify({ role: 'overlay2' }));
    console.log('[Alerta] Conectado');
  });
  socket.addEventListener('message', e => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'donation' && msg.username) {
      const mins = Math.round((msg.secs || 0) / 60);
      showAlerta(msg.username, msg.amount || 0, mins);
    }
  });
  socket.addEventListener('close', () => { socket = null; setTimeout(connect, 5000); });
  socket.addEventListener('error', () => {});
}

connect();
</script>
</body>
</html>
