<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>TTS</title>
</head>
<body>
<script>
const WS_URL = 'wss://stream-counter-server-production.up.railway.app';

let queue = [];
let playing = false;

function speak(text) {
  queue.push(text);
  processQueue();
}

function processQueue() {
  if (playing || queue.length === 0) return;
  playing = true;
  const text = queue.shift();

  // Google Translate TTS (sin API key)
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=es&client=tw-ob&q=' + encodeURIComponent(text);
  const audio = new Audio(url);
  audio.volume = 1.0;
  audio.onended = () => { playing = false; processQueue(); };
  audio.onerror = (err) => {
    console.error('Error TTS:', err);
    playing = false;
    processQueue();
  };
  audio.play().catch(err => {
    console.error('Play error:', err);
    playing = false;
    processQueue();
  });
}

let socket = null;

function connectWS() {
  try { socket = new WebSocket(WS_URL); } catch(e) { setTimeout(connectWS, 5000); return; }
  socket.addEventListener('open', () => {
    socket.send(JSON.stringify({ role: 'tts' }));
    console.log('[TTS] Conectado');
  });
  socket.addEventListener('message', (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'tts' && msg.text) speak(msg.text);
  });
  socket.addEventListener('close', () => { socket = null; setTimeout(connectWS, 5000); });
}

connectWS();
</script>
</body>
</html>
