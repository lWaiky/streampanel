<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>TTS</title>
</head>
<body>
<script>
const WS_URL = 'wss://stream-counter-server-production.up.railway.app';
const VOICE = 'es-ES-Standard-A'; // voz en español

let queue = [];
let playing = false;

function speak(text) {
  queue.push(text);
  processQueue();
}

function processQueue() {
  if (playing || queue.length === 0) return;
  playing = true;
  const text = queue.shift();

  // StreamElements TTS API
  const url = `https://api.streamelements.com/kappa/v2/speech?voice=${VOICE}&text=${encodeURIComponent(text)}`;
  const audio = new Audio(url);
  audio.volume = 1.0;
  audio.onended = () => { playing = false; processQueue(); };
  audio.onerror = () => { playing = false; processQueue(); };
  audio.play().catch(() => { playing = false; processQueue(); });
}

let socket = null;

function connectWS() {
  try { socket = new WebSocket(WS_URL); } catch(e) { setTimeout(connectWS, 5000); return; }

  socket.addEventListener('open', () => {
    socket.send(JSON.stringify({ role: 'tts' }));
    console.log('[TTS] Conectado');
  });

  socket.addEventListener('message', (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'tts' && msg.text) {
      speak(msg.text);
    }
  });

  socket.addEventListener('close', () => {
    socket = null;
    setTimeout(connectWS, 5000);
  });
}

connectWS();
</script>
</body>
</html>
